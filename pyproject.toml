[project]
name = "geosetter_lite"
dynamic = ["version"]
description = "Geotagging application"
readme = "README.md"
requires-python = ">=3.12.9"
dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
    "pillow-heif>=0.13.0",
    "requests>=2.31.0",
    # PyTorch dropped Intel Mac builds after 2.2.2, and that release needs
    # NumPy 1.x. Transformers 4.52+ refuses .bin weights (the only format the
    # CLIP model is published in) on PyTorch older than 2.6. Every other
    # platform gets the current versions.
    "torch>=2.0.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchvision>=0.15.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "transformers>=4.30.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision==0.17.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers>=4.30.0,<4.52; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "PyYAML>=6.0"
]

[project.scripts]
geosetter-lite = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "geosetter_lite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["geosetter_lite"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "geosetter_lite/data"
"main.py" = "geosetter_lite/main.py"
